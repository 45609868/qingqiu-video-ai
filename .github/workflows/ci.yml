name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-typecheck:
    name: Backend Typecheck & Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  backend-migrate:
    name: Backend DB Migration Check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Test migrations on fresh DB
        run: |
          rm -f /tmp/test_qq.db
          DB_PATH=/tmp/test_qq.db node scripts/migrate.mjs
          sqlite3 /tmp/test_qq.db ".tables" | wc -l
      - name: Test idempotency
        run: |
          DB_PATH=/tmp/test_qq.db node scripts/migrate.mjs

  frontend-build:
    name: Frontend Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
