app:
  name: "清秋AI短剧 API"
  version: "1.0.0"
  debug: true
  language: "zh"

server:
  port: 5679
  host: "0.0.0.0"
  cors_origins:
    - "http://localhost:3013"
    - "http://localhost:5679"
  read_timeout: 600
  write_timeout: 600

database:
  type: "sqlite"
  path: "./data/qingqiu_drama.db"
  max_idle: 10
  max_open: 100

storage:
  type: "local"
  local_path: "./data/static"
  base_url: "http://localhost:5679/static"

ai:
  default_text_provider: "openai"
  default_image_provider: "minimax"
  default_video_provider: "minimax"
  default_tts_provider: "minimax"

video:
  default_aspect_ratio: "9:16"   # 竖屏短剧默认
  default_resolution: "1080x1920"
  default_fps: 24
  default_duration_seconds: 5

drama:
  default_total_episodes: 60      # 红果短剧 60-100 集
  default_episode_duration: 90    # 1-3 分钟/集
